      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#3da9fc"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="150" rx="24" fill="url(#bg)"/>
  <circle cx="640" cy="-10" r="110" fill="#ffffff" opacity=".08"/>
  <circle cx="690" cy="150" r="80" fill="#ffffff" opacity=".07"/>
  <!-- Dampf -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".6">
    <path d="M70 38 q-9 -12 0 -24"/>
    <path d="M92 40 q-9 -12 0 -24"/>
    <path d="M114 38 q-9 -12 0 -24"/>
  </g>
  <!-- Tasse -->
