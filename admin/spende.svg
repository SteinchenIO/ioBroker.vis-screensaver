  <path d="M140 66 h12 a17 17 0 0 1 0 34 h-18" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M92 112 c-14 -9 -24 -17 -24 -27 a13 13 0 0 1 24 -6 a13 13 0 0 1 24 6 c0 10 -10 18 -24 27 z" fill="#ff5d73"/>
  <ellipse cx="92" cy="140" rx="64" ry="5" fill="#000" opacity=".15"/>
  <!-- Text -->
  <text x="190" y="62" font-family="'Segoe UI', system-ui, Roboto, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Gefällt dir der Bildschirmschoner?</text>
  <text x="190" y="94" font-family="'Segoe UI', system-ui, Roboto, Arial, sans-serif" font-size="18" fill="#ffffff" opacity=".92">Eine kleine Spende hilft bei der Weiterentwicklung.</text>
