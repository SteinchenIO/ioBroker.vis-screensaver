  <path d="M214 129 c-7 -5 -12 -9 -12 -14 a6.5 6.5 0 0 1 12 -3 a6.5 6.5 0 0 1 12 3 c0 5 -5 9 -12 14 z" fill="#ff5d73"/>
  <text x="338" y="127" text-anchor="middle" font-family="'Segoe UI', system-ui, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#4b3fc4">Spendier mir einen Kaffee</text>
</svg>
